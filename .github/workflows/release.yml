name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver without the v prefix, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Stamp release version
        run: node scripts/stamp-version.mjs ${{ inputs.version }}

      - name: Pack release
        run: pnpm pack

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: gh release create "$TAG" powercontext-dsh-*.tgz --title "powercontext-dsh $TAG" --generate-notes --latest
